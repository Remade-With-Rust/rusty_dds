# Build gates the portfolio harness does not cover (it runs `cargo test` on
# stable with default features). Plan: docs/plans/astc.md, gates DC6/DC7.
#
# - msrv:      the library builds on its declared rust-version (1.73).
# - no-simd:   without `simd` the crate is `forbid(unsafe_code)`; it must build.
# - wasm32:    pure Rust, no C: the decode/encode/astc surface builds for
#              wasm32-unknown-unknown.
# - clippy:    `cargo clippy --all-targets --all-features -- -D warnings` is
#              clean, src/astc/ included.
# - release:   the ASTC robustness test at full size (10^6 arbitrary blocks per
#              footprint) and the oracle golden vectors, optimised.

name: build-gates

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.73"
      # The lockfile (v4) and the dev-dependencies need a newer cargo; the MSRV
      # promise is for the library, so build it from a manifest without them.
      - name: Library-only manifest
        run: |
          python3 - <<'PY'
          s = open('Cargo.toml', encoding='utf-8').read()
          open('Cargo.toml', 'w', encoding='utf-8').write(s[:s.index('[dev-dependencies]')])
          PY
          rm -f Cargo.lock
      - run: cargo build --lib --features astc

  no-simd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --lib --no-default-features --features decode,encode,astc
      - run: cargo test --lib --no-default-features --features decode,encode,astc astc

  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features decode,encode,astc

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --lib astc

  # EC3: the frozen ASTC encoder hashes must hold on aarch64 and wasm32 too
  # (no floating-point divergence across targets).
  determinism-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --test astc_determinism
      # NEON twins of the ASTC decoder against their scalar oracles.
      - run: cargo test --release --lib astc

  determinism-wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # Pinned release tarball: the install script resolves "latest" through
      # the GitHub API and breaks when that call is rate-limited.
      - name: Install wasmtime
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v27.0.0/wasmtime-v27.0.0-x86_64-linux.tar.xz | tar -xJ -C "$HOME"
          mkdir -p "$HOME/.wasmtime/bin"
          mv "$HOME/wasmtime-v27.0.0-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/"
      - run: |
          export PATH="$HOME/.wasmtime/bin:$PATH"
          wasmtime --version
          CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime cargo test --release --target wasm32-wasip1 --no-default-features --features decode,encode,astc --test astc_determinism

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: a new stable adds lints and would turn this red with no code
      # change. Bump deliberately, together with any fixes it asks for.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
