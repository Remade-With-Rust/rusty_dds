[package]
name = "rusty_dds"
version = "0.9.0"
authors = [
    "Mike Dilger <mike@optcomp.nz>",
    "Remade With Rust / Mata Network",
]
description = "Memory-safe DDS texture toolkit — zero-copy container parse, decode, encode (BC1-BC7, BC6H HDR), rate-distortion optimization, GPU upload plans (Remade With Rust)"
repository = "https://github.com/Remade-With-Rust/rusty_dds"
homepage = "https://github.com/Remade-With-Rust/rusty_dds"
documentation = "https://docs.rs/rusty_dds"
license = "MIT"
keywords = ["dds", "texture", "directx", "bc7", "compression"]
categories = ["encoding", "graphics", "parsing"]
readme = "README.md"
edition = "2021"
rust-version = "1.73"
exclude = [
    "fuzz/*",
    # The simulator demo: its own crate, its own MSRV, never part of the
    # published library package.
    "sim/*",
    "third_party/*",
    "tools/*",
    "corpus/raw/*",
    "corpus/raw_crytif/*",
    "corpus/raw_tif/*",
    "corpus/raw_hdr/*",
    "corpus/manifest.json",
    "bench/preserved/*",
    "docs/artifacts/*.json",
    "target/*",
    # Internal campaign planning: refutation ledgers, session coordination
    # notes and measurement archaeology. Useful in the repo, noise in a
    # published package.
    "docs/plans/*",
    # Campaign instruments, not user-facing examples. They exist to A/B one
    # kernel against its predecessor and several depend on fixtures or a
    # baseline binary that is not part of the package. `probe_rdo_exact` stays:
    # it is a declared target and a documented reproduction step.
    "examples/probe_6hbytes.rs",
    "examples/probe_bc123_dec.rs",
    "examples/probe_bc45_dec.rs",
    "examples/probe_bc6h_dec.rs",
    "examples/probe_encbytes.rs",
    "examples/probe_idx_spread.rs",
    "examples/probe_npot_dec.rs",
    "examples/probe_rdo_bytes.rs",
    "examples/probe_snorm_bytes.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["decode", "encode", "simd"]
# CPU BCn/RGBA decode via bcdec_rs (pure Rust).
decode = ["dep:bcdec_rs"]
# CPU RGBA → DDS encode (pure Rust; no extra deps).
encode = []
# AVX2 twins of the hot encode kernels (runtime-detected, scalar fallback,
# byte-identical output either way). Off => zero `unsafe` in the crate.
simd = []
# DEVELOPMENT ONLY. Re-opens the frozen encoder tuning constants
# (src/encode/tuning.rs) and the BC4/5 refine harvest to `RUSTY_DDS_*`
# environment overrides so the campaign harnesses can sweep them. A shipped
# build must never enable this: encoder output would stop being a pure
# function of (source bytes, crate version, EncodeLayout).
tuning = []

[dependencies]
bitflags = "2.4"
byteorder = "1.5"
enum-primitive-derive = "0.2"
num-traits = "0.2"
bcdec_rs = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Off-the-shelf container baseline for parse A/B (not used by the library itself).
ddsfile = "0.5.2"
serde_json = "1"
tiff = { version = "0.9", default-features = true }
# BC6H decode-oracle for tests (same crate/version the decode feature uses).
bcdec_rs = "0.2"
# Pure-Rust deflate for the RDO rate harness (rate metric = zip/p4k channel).
miniz_oxide = "0.8"
png = "0.17"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"

[[bin]]
name = "rusty-dds"
path = "src/bin/rusty_dds.rs"
required-features = ["decode", "encode"]

[[bin]]
name = "ddsinfo"
path = "src/bin/ddsinfo.rs"

[[bin]]
name = "retag"
path = "src/bin/retag.rs"

[[bench]]
name = "parse_ab"
harness = false

[[bench]]
name = "decode_ab"
harness = false
required-features = ["decode"]

[[example]]
name = "gen_fixtures"

[[example]]
name = "bench_vs_directxtex"
required-features = ["decode"]

[[example]]
name = "bench_baselines"
required-features = ["decode", "encode"]

[[example]]
name = "harvest_encode_quality"
required-features = ["decode", "encode"]

[[example]]
name = "harvest_encode_quality_vs_dxtex"
required-features = ["decode", "encode"]

[[example]]
name = "harvest_corpus_vs_dxtex"
required-features = ["decode", "encode"]

[[example]]
name = "harvest_corpus_decode_vs_dxtex"
required-features = ["decode", "encode"]

[[example]]
name = "demo_tiff_side_by_side"
required-features = ["decode", "encode"]

[[example]]
name = "bench_encode_corpus"
required-features = ["decode", "encode"]

[[example]]
name = "harvest_rdo"
required-features = ["decode", "encode"]

[[example]]
name = "probe_rdo_exact"
required-features = ["decode", "encode"]

[[test]]
name = "decode_matrix"
required-features = ["decode"]

[[test]]
name = "bc6h_decode"
required-features = ["decode", "encode"]

[[test]]
name = "bc6h_encode"
required-features = ["decode", "encode"]

[[test]]
name = "encode_matrix"
required-features = ["encode", "decode"]

[[test]]
name = "encode_determinism"
required-features = ["encode"]

[[test]]
name = "parser_robustness"
required-features = ["decode"]

# THE JSON SWAP (rusty_json_turbo). One table converts the WHOLE graph.
#
# `serde_json` here is the house fork, `Remade-With-Rust/rusty_json_turbo`: a
# performance fork whose output is byte-identical to upstream's by contract,
# gated per commit against upstream serde_json linked in the same process --
# bytes, `Value`, error text with line and column, float bit patterns and
# `StreamDeserializer` offsets. Its LIBRARY is still called `serde_json`, so
# every `use serde_json::...` line in this repository is untouched.
#
# WHY A PATCH AND NOT A RENAMED DEPENDENCY. Writing
# `serde_json = { package = "rusty_json_turbo", ... }` would convert only the
# JSON this repository calls itself, leaving every third-party copy on
# upstream -- and the two would then be DIFFERENT TYPES, so a `Value` handed
# across that boundary would not compile. A patch converts every copy at once
# and leaves exactly one `Value` in the graph.
#
# The patch target is a shim package inside the fork named `serde_json`, which
# exists because `[patch]` matches on PACKAGE name and the fork's package is
# `rusty_json_turbo`. See that repository's `crates/serde_json-shim/`.
[patch.crates-io]
serde_json = { git = "https://github.com/Remade-With-Rust/rusty_json_turbo", branch = "master" }
