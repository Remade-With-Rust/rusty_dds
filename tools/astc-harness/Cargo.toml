[package]
name = "astc_harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "Differential harness for the rusty_dds ASTC module against the astc-oracle (astcenc 5.7.1). WSL dev tool; not part of the published crate."

# Standalone: never a member of the library package.
[workspace]

[dependencies]
rusty_dds = { path = "../..", default-features = false, features = ["decode", "encode", "astc", "__astc_internals", "ktx2-zstd", "tuning"] }
png = "0.17"
# CPU-time clocks for the speed gates (robust to preemption on a shared host).
libc = "0.2"
# Third-party readers for container gates (C3): the dds crate decodes ASTC via astc-decode.
dds = "=0.2.0"
astc-decode = "=0.3.1"

[profile.release]
debug = 1
overflow-checks = true
